[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renkolcum"
version = "0.1.0"
description = "Renk Ölçüm Sistemi (dummy) — simüle spektrofotometre, reçete hesaplama, Supabase bulut senkronu"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
# Mevcut uygulamanın .mdb dosyalarını okumak için
mdb = [
  "access-parser>=0.0.6",
  "pyodbc>=5; sys_platform == 'win32'",
  "tzdata; sys_platform == 'win32'",
]
test = ["pytest>=7", "access-parser>=0.0.6"]

[project.scripts]
renkolcum = "renkolcum.cli:main"

[tool.setuptools]
packages = ["renkolcum"]
