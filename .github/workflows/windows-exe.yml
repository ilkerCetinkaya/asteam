# Windows için Python gerektirmeyen .exe dosyalarını derler (ücretsiz GitHub Actions).
# Çıktı: Actions → bu iş → Artifacts → "RenkOlcum-Windows" (zip)
name: Windows exe
on:
  push:
    paths: ["renkolcum/**", "windows/**", "pyproject.toml", ".github/workflows/windows-exe.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[mdb,test]" pyinstaller
      - name: Testler (bulut gerektirmeyenler)
        run: pytest -q tests/test_colorimetry.py tests/test_spectro_recipe.py tests/test_mdb_bridge.py -k "discover or extract or fraction"
      - name: Derle
        run: |
          $ortak = @("--onefile", "--paths", ".", "--collect-submodules", "renkolcum", "--collect-all", "access_parser", "--collect-data", "tzdata")
          pyinstaller @ortak --name renkolcum windows/renkolcum_main.py
          pyinstaller @ortak --noconsole --name renkolcum-kopru windows/kopru_main.py
      - name: Exe duman testi
        shell: pwsh
        env:
          RENKOLCUM_HOME: ${{ runner.temp }}\renkolcum-test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $ErrorActionPreference = "Stop"
          .\dist\renkolcum.exe --version
          .\dist\renkolcum.exe mdb-kesfet tests\mdb\genis_v1.mdb --yaz dist\esleme.ornek.json --okuyucu parser
          if (-not (Test-Path dist\esleme.ornek.json)) { throw "eşleme üretilemedi" }
          .\dist\renkolcum.exe mdb-izle tests\mdb --esleme dist\esleme.ornek.json --desen genis_v1.mdb --tek-sefer
          .\dist\renkolcum.exe durum | Tee-Object -Variable durum
          if (-not ($durum -match "Bekleyen\s+:\s+2")) { throw "köprü 2 ölçümü kuyruğa almadı" }
      - name: Paketle
        shell: pwsh
        run: Copy-Item windows\kur.ps1, windows\KURULUM.txt dist\
      - uses: actions/upload-artifact@v4
        with:
          name: RenkOlcum-Windows
          path: dist/
