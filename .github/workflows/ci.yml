name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]" "psycopg[binary]"
      - name: Testler (kolorimetri, reçete, RLS + uçtan uca bulut)
        run: pytest -q
      - name: SQL şeması + RLS testleri
        run: sudo -E bash supabase/tests/run_local.sh
